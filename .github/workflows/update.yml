name: Update market data
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '20 1 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update data
        run: python update_data.py
      - name: Validate JSON
        run: python - <<'PY'
          import json
          p=json.load(open('data/market.json',encoding='utf-8'))
          assert isinstance(p.get('data'),list) and len(p['data'])>=100
          print('Validated records:',len(p['data']))
          print('Last:',p['data'][-1])
          PY
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          git diff --cached --quiet || git commit -m 'Update market data'
          git push
